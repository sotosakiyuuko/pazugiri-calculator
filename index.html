  <script>
    "use strict";
    const dropMaterials=["ウロコ","お花","お魚","お米","カニのはさみ","サイコロ","サンゴ","トラの毛皮","ネジ","ふさふさの毛","みかげ石","ろうそく","羽衣","塩","火打ち石","丸太","鬼のツノ","元結","骨付き肉","昆布","手旗","獣の牙","真珠貝","水","大豆","鉄","桃","粘土","麦","木の枝","油","葉っぱ","卵"];
    const stages=[["1-2",["葉っぱ","水","桃"]],["1-4",["ふさふさの毛","丸太","大豆","骨付き肉","卵"]],["1-7",["麦","丸太","葉っぱ"]],["1-9",["水","大豆","桃"]],["1-11",["麦","ふさふさの毛","骨付き肉"]],["1-12",["ふさふさの毛","麦","丸太","獣の牙","トラの毛皮"]],["1-13",["葉っぱ","大豆","卵"]],["1-17",["水","大豆","トラの毛皮","鬼のツノ"]],["2-2",["お米","麦","大豆"]],["2-5",["鉄","骨付き肉"]],["2-6",["お魚","木の枝","粘土","水"]],["2-7",["お魚","粘土","油","水"]],["2-11",["お魚","粘土","水"]],["2-12",["お米","大豆","お魚","鉄","卵"]],["2-16",["丸太","火打ち石","木の枝","サイコロ"]],["2-19",["お米","ふさふさの毛","骨付き肉"]],["2-22",["みかげ石","火打ち石","木の枝","ろうそく"]],["2-24",["サイコロ","ろうそく","みかげ石"]],["2-25",["お花","木の枝","丸太"]],["2-27",["水","鬼のツノ","獣の牙","トラの毛皮"]],["2-29",["ふさふさの毛","元結"]],["3-2",["お米","塩","水","昆布","真珠貝"]],["3-4",["油","ネジ","鉄","みかげ石","真珠貝"]],["3-7",["お花","みかげ石","お米","鉄","真珠貝","桃"]],["3-9",["大豆","麦","真珠貝","手旗"]],["3-12",["粘土","木の枝","丸太","手旗"]],["3-14",["サイコロ","手旗","トラの毛皮"]],["3-17",["水","大豆","カニのはさみ","真珠貝","サンゴ","昆布"]],["3-19",["火打ち石","ろうそく"]],["3-21",["粘土","カニのはさみ","みかげ石","桃"]],["3-24",["葉っぱ","塩","桃","サンゴ","お魚","ウロコ"]],["3-26",["お米","塩","水","獣の牙","昆布"]],["3-29",["塩","みかげ石","カニのはさみ","サンゴ","昆布"]],["3-31",["火打ち石","ろうそく"]],["3-33",["塩","油","ネジ","鉄"]],["3-35",["塩","羽衣","ウロコ","サンゴ"]]].map(([id,drops])=>({id,drops}));
    const regularMaterials=["すごろく","花札","あんぱん","鍬","お茶碗","お団子","そろばん","囲碁","お味噌汁","二色おはぎ","天ぷら","書き物道具"];
    const insightMaterials=["短刀の心得","打刀の心得","大太刀の心得","太刀の心得","槍の心得","脇差の心得","薙刀の心得"];
    const recipes={"すごろく":{"サイコロ":1,"紙":2,"獣の牙":1,"手旗":1},"花札":{"紙":5,"お花":5,"筆":2,"サンゴ":2},"あんぱん":{"麦":3,"卵":1,"大豆":1,"花の蜜":1},"鍬":{"とんかち":5,"丸太":5,"鉄":2},"お茶碗":{"お椀":4,"鉄":4,"火打ち石":1},"お団子":{"葉っぱ":1,"桃":1,"花の蜜":1,"お花":1},"そろばん":{"とんかち":5,"鉄":3,"木の枝":1,"丸太":1},"囲碁":{"丸太":1,"獣の牙":1,"お椀":1,"ウロコ":1},"お味噌汁":{"味噌":2,"葉っぱ":1,"水":1,"昆布":1},"二色おはぎ":{"お米":4,"塩":1,"大豆":1,"花の蜜":1},"天ぷら":{"油":2,"お魚":2,"卵":1,"麦":1},"書き物道具":{"筆":1,"紙":2,"みかげ石":2,"ろうそく":2},"短刀の心得":{"紙":6,"筆":6,"粘土":12},"打刀の心得":{"紙":6,"筆":6,"鬼のツノ":4},"大太刀の心得":{"紙":6,"筆":6,"トラの毛皮":2},"太刀の心得":{"紙":6,"筆":6,"みかげ石":6},"槍の心得":{"紙":6,"筆":6,"火打ち石":20},"脇差の心得":{"紙":6,"筆":6,"真珠貝":4},"薙刀の心得":{"紙":6,"筆":6,"獣の牙":4},"紙":{"木の枝":1,"丸太":1,"水":1},"筆":{"木の枝":2,"ふさふさの毛":1},"花の蜜":{"水":1,"お花":2},"とんかち":{"丸太":1,"鉄":1},"お椀":{"粘土":1,"火打ち石":1},"味噌":{"お米":1,"大豆":1,"塩":1},"臼と杵":{"丸太":2,"水":2}};
    const calculatorMaterials=["サイコロ","獣の牙","手旗","お花","サンゴ","麦","卵","大豆","丸太","鉄","粘土","みかげ石","火打ち石","葉っぱ","桃","木の枝","鬼のツノ","ウロコ","水","昆布","トラの毛皮","ふさふさの毛","お米","塩","油","お魚","ろうそく","真珠貝"];
    const main=document.querySelector("main");
    const state={dropSearch:"",selectedDrops:[],selections:[...Array.from({length:4},()=>({name:"",quantity:1})),{name:"",quantity:1}],owned:{},hideZero:true};
    const esc=value=>String(value).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[c]));
    const route=()=>{const [name,query=""]=(location.hash.slice(1)||"home").split("?");return {name,params:new URLSearchParams(query)}};
    const go=(name,params)=>location.hash=params?name+"?"+params.toString():name;
    const filtered=materials=>stages.filter(stage=>materials.every(material=>stage.drops.includes(material)));
    function expand(name,quantity,total){if(recipes[name])return Object.entries(recipes[name]).forEach(([part,amount])=>expand(part,quantity*amount,total));total[name]=(total[name]||0)+quantity}
    function requirements(){const total={};state.selections.forEach(({name,quantity})=>{if(name&&Number(quantity)>0)expand(name,Number(quantity),total)});return calculatorMaterials.map(name=>({name,required:total[name]||0}))}
    function home(){main.innerHTML=`<section class="hero" aria-labelledby="home-title"><div><p class="eyebrow">刀剣乱舞ぱずぎり · 玩家工具</p><h1 id="home-title">把素材需求，理成下一步。</h1><p>快速筛选可以同时掉落目标素材的关卡，或手动输入二级材料，换算上限解放所需的最终掉落素材。</p></div><div class="blade-card" aria-hidden="true"><p>资料型工具界面。数据以当前收录的 Excel 为准。</p></div></section><section class="action-grid" aria-label="核心工具"><article class="action-card"><p class="eyebrow">查询</p><h2>素材关卡查询</h2><p>一次选择多种素材，只保留能够同时掉落它们的关卡。</p><a class="button" href="#drops">开始查询</a></article><article class="action-card"><p class="eyebrow">计算</p><h2>上限解放计算器</h2><p>按配方展开二级与一级物品，得到最终所需掉落素材与缺口。</p><a class="button secondary" href="#calculator">开始计算</a></article></section>`}
    function drops(params){const incoming=params.get("materials");if(incoming){state.selectedDrops=[...new Set(decodeURIComponent(incoming).split(",").filter(x=>dropMaterials.includes(x)))];history.replaceState(null,"","#drops")}const selected=state.selectedDrops,available=dropMaterials.filter(x=>x.includes(state.dropSearch)),results=filtered(selected);main.innerHTML=`<section class="page-head"><div><p class="eyebrow">素材关卡查询</p><h1>按素材找关卡</h1><p>多选时只显示<strong>同时</strong>掉落全部已选素材的关卡。未选择素材时展示全部关卡。</p></div><button class="button ghost" id="clear">清除筛选</button></section><section class="tool-layout"><aside class="panel" aria-label="筛选素材"><h2>选择目标素材</h2><p class="panel-note">已选择 ${selected.length} 项。输入名称可快速查找。</p><div class="tag-list">${selected.length?selected.map(x=>`<span class="tag">${esc(x)} <button data-remove="${esc(x)}" aria-label="移除 ${esc(x)}">×</button></span>`).join(""):'<span class="panel-note">尚未选择素材</span>'}</div><label class="section-label" for="search">全部可查询素材</label><div class="material-picker"><input id="search" value="${esc(state.dropSearch)}" placeholder="输入素材名称" autocomplete="off"><div class="options">${available.map(x=>`<button type="button" class="option" data-option="${esc(x)}" aria-pressed="${selected.includes(x)}"><span>${esc(x)}</span><span>${selected.includes(x)?"已选":"选择"}</span></button>`).join("")||'<p class="empty">没有匹配的素材名称</p>'}</div></div></aside><section class="panel" aria-live="polite"><div class="result-head"><h2>符合条件的关卡</h2><span class="result-count">${results.length} 个</span></div><p class="panel-note">红色标签为你的目标素材。关卡数据未包含体力消耗、掉落数量或备注，因此不在这里推测展示。</p><div class="stage-list">${results.length?results.map(s=>`<article class="stage-card"><div class="stage-card-top"><span class="stage-id">${s.id}</span><span class="matches">命中 ${selected.length||s.drops.length} 项目标</span></div><ul class="drop-list">${s.drops.map(x=>`<li class="${selected.includes(x)?"match":""}">${esc(x)}</li>`).join("")}</ul></article>`).join(""):'<p class="empty">没有关卡能够同时掉落目前选择的素材。请减少筛选条件后重试。</p>'}</div></section></section>`;document.querySelector("#search").oninput=e=>{state.dropSearch=e.target.value.trim();drops(new URLSearchParams())};document.querySelectorAll("[data-option]").forEach(b=>b.onclick=()=>{const x=b.dataset.option;state.selectedDrops=selected.includes(x)?selected.filter(y=>y!==x):[...selected,x];drops(new URLSearchParams())});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{state.selectedDrops=selected.filter(x=>x!==b.dataset.remove);drops(new URLSearchParams())});document.querySelector("#clear").onclick=()=>{state.selectedDrops=[];state.dropSearch="";drops(new URLSearchParams())}}
    const options=(items,current)=>`<option value="">不选择</option>${items.map(x=>`<option value="${esc(x)}" ${x===current?"selected":""}>${esc(x)}</option>`).join("")}`;
    function calculator(){const rows=requirements().map(x=>{const owned=Math.max(0,Number(state.owned[x.name])||0);return {...x,owned,lacking:Math.max(0,x.required-owned)}}),shown=state.hideZero?rows.filter(x=>x.required||x.owned):rows;main.innerHTML=`<section class="page-head"><div><p class="eyebrow">上限解放素材计算器</p><h1>手动选择材料，计算缺口</h1><p>前四格可选择普通二级物品，第五格选择心得类二级物品。计算规则与 Excel 配方展开保持一致。</p></div></section><section class="calculator-grid"><section class="panel"><h2>输入所需二级物品</h2><p class="panel-note">数量默认为 1；不需要的行保持“不选择”即可。</p><div>${state.selections.map((item,i)=>`<div class="selection-row"><label for="material-${i}">${i+1}</label><select id="material-${i}" data-name="${i}" aria-label="${i===4?"心得类二级物品":"二级物品"}">${options(i===4?insightMaterials:regularMaterials,item.name)}</select><input type="number" min="0" step="1" value="${item.quantity}" data-quantity="${i}" aria-label="${i+1} 所需数量"></div>`).join("")}</div><div class="calc-actions"><button type="button" class="button secondary" id="reset">重置</button><button type="button" class="button" id="send">查询这些素材的掉落关卡</button></div><label class="toggle"><input id="hide" type="checkbox" ${state.hideZero?"checked":""}>默认隐藏数量为 0 的素材</label></section><section class="panel" aria-live="polite"><div class="result-head"><h2>最终所需掉落素材</h2><span class="result-count">${shown.filter(x=>x.lacking).length} 种缺少</span></div><p class="panel-note">“已有”由你自行填写，缺少数量不会低于 0。</p><div class="table-wrap"><table class="material-table"><thead><tr><th>素材</th><th>所需</th><th>已有</th><th>缺少</th></tr></thead><tbody>${shown.length?shown.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.required}</td><td><input type="number" min="0" step="1" value="${x.owned||""}" placeholder="0" data-owned="${esc(x.name)}" aria-label="${esc(x.name)} 已有数量"></td><td class="${x.lacking?"need":"zero"}">${x.lacking}</td></tr>`).join(""):'<tr><td colspan="4" class="empty">请先选择至少一项材料。</td></tr>'}</tbody></table></div></section></section>`;document.querySelectorAll("[data-name]").forEach(e=>e.onchange=()=>{state.selections[+e.dataset.name].name=e.value;calculator()});document.querySelectorAll("[data-quantity]").forEach(e=>e.oninput=()=>{state.selections[+e.dataset.quantity].quantity=Math.max(0,Number(e.value)||0);calculator()});document.querySelectorAll("[data-owned]").forEach(e=>e.oninput=()=>{state.owned[e.dataset.owned]=Math.max(0,Number(e.value)||0);calculator()});document.querySelector("#hide").onchange=e=>{state.hideZero=e.target.checked;calculator()};document.querySelector("#reset").onclick=()=>{state.selections=[...Array.from({length:4},()=>({name:"",quantity:1})),{name:"",quantity:1}];state.owned={};state.hideZero=true;calculator()};document.querySelector("#send").onclick=()=>go("drops",new URLSearchParams({materials:rows.filter(x=>x.lacking).map(x=>x.name).join(",")}))}
    function about(){main.innerHTML=`<section class="about"><p class="eyebrow">使用说明</p><h1>资料范围与使用方式</h1><div class="notice">本网站为非官方玩家工具，与游戏官方及相关权利方无关。</div><div class="panel"><h2>素材关卡查询</h2><ul><li>可同时选择多种素材，结果只保留同时掉落全部目标素材的关卡。</li><li>不选素材时显示全部已收录关卡。</li><li>数据目前含关卡名与掉落种类，不包含体力消耗、章节说明、掉落数量或概率。</li></ul></div><div class="panel"><h2>上限解放计算器</h2><ul><li>手动选择四项普通二级物品及一项心得类二级物品，并填写数量。</li><li>网站会递归展开一级物品，计算最终需要的直接掉落素材。</li><li>填写“已有”后，缺少数量按“所需 − 已有”计算，最低为 0。</li></ul></div><div class="panel"><h2>数据维护</h2><p>游戏更新时，修改本文件中“素材数据与配方”部分即可。</p></div></section>`}
    function render(){const current=route();if(current.name==="drops")drops(current.params);else if(current.name==="calculator")calculator();else if(current.name==="about")about();else home()}
    window.addEventListener("hashchange",render);render();
  </script>
</body>
</html>
