    const main=document.querySelector("main");
    const emptySelections=stage=>Array.from({length:stage==="1"?2:stage==="2"?4:stage==="3"?6:0},()=>({name:"",quantity:1}));
    const state={dropSearch:"",selectedDrops:[],rarity:"",swordType:"",swordId:"",stage:"",manualStage:"",selections:[],owned:{},hideZero:true};
    const esc=value=>String(value).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[c]));
    const route=()=>{const [name,query=""]=(location.hash.slice(1)||"home").split("?");return {name,params:new URLSearchParams(query)}};
    const go=(name,params)=>location.hash=params&&params.toString()?name+"?"+params.toString():name;
    const icon=(name,size="")=>itemIcons[name]?`<img class="item-icon ${size}" src="${itemIcons[name]}" alt="" aria-hidden="true">`:`<span class="item-icon-placeholder" aria-hidden="true"></span>`;
    const filtered=materials=>stages.filter(stage=>materials.every(material=>stage.drops.includes(material)));
    function expand(name,quantity,total,stack=[]){
      if(name==="小判")return;
      if(stack.includes(name))throw new Error(`配方循环：${[...stack,name].join(" → ")}`);
      if(Object.prototype.hasOwnProperty.call(recipes,name)){
        Object.entries(recipes[name]).forEach(([part,amount])=>expand(part,quantity*amount,total,[...stack,name]));
        return;
      }
      total[name]=(total[name]||0)+quantity;
    }
    const selectedSword=()=>swords.find(sword=>sword.id===state.swordId);
    const selectedStage=()=>{const sword=selectedSword();return sword?sword.stages.find(stage=>String(stage.stage)===String(state.stage)):null};
    const autoActive=()=>Boolean(selectedSword()&&selectedStage());
    function requirementData(){
      const total={};
      const inputs=autoActive()?selectedStage().materials:state.selections.map(item=>[item.name,item.quantity]);
      inputs.forEach(([name,quantity])=>{if(name&&Number(quantity)>0)expand(name,Number(quantity),total)});
      const unknown=Object.keys(total).filter(name=>!dropMaterials.includes(name));
      const rows=dropMaterials.map(name=>({name,required:total[name]||0}));
      return {rows,unknown};
    }
    function home(){main.innerHTML=`<section class="hero" aria-labelledby="home-title"><div><p class="eyebrow">刀剣乱舞ぱずぎり · 玩家工具</p><h1 id="home-title">合理规划体力，不当时政冤种</h1><p class="creator-contact">作者：里崎夕子<br>报错请联系小红书账号：@里崎夕子（ID：1165014862）</p><p>可按稀有度、刀种、刀剑和突破阶段快速计算，也可以先选择解放阶段，再手动输入对应材料。</p></div><div class="blade-card"><div class="update-log"><h2>更新日志</h2><p>V.2.1.1（2026.10.05）</p><ol><li>新增刀剑筛选功能，各位絵巻守可以通过筛选刀剑及突破阶段快速查找所需掉落材料种类及数量</li><li>新增素材图标</li><li>修改赠物名称</li><li>新增作者声明</li></ol></div></div></section><section class="action-grid" aria-label="核心工具"><article class="action-card"><p class="eyebrow">查询</p><h2>素材关卡查询</h2><p>一次选择多种素材，只保留能够同时掉落它们的关卡。</p><a class="button" href="#drops">开始查询</a></article><article class="action-card"><p class="eyebrow">计算</p><h2>上限解放计算器</h2><p>按所选阶段展开贈物配方，得到最终所需掉落素材与缺口。</p><a class="button secondary" href="#calculator">开始计算</a></article></section>`}
    function drops(params){
      const incoming=params.get("materials");
      if(incoming!==null){state.selectedDrops=[...new Set(incoming.split(",").filter(x=>dropMaterials.includes(x)))];history.replaceState(null,"","#drops")}
      const selected=state.selectedDrops,available=dropMaterials.filter(x=>x.includes(state.dropSearch)),results=filtered(selected);
      main.innerHTML=`<section class="page-head"><div><p class="eyebrow">素材关卡查询</p><h1>按素材找关卡</h1><p>多选时只显示<strong>同时</strong>掉落全部已选素材的关卡。未选择素材时展示全部关卡。</p></div><button class="button ghost" id="clear">清除筛选</button></section><section class="tool-layout"><aside class="panel" aria-label="筛选素材"><h2>选择目标素材</h2><p class="panel-note">已选择 ${selected.length} 项。输入名称可快速查找。</p><div class="tag-list">${selected.length?selected.map(x=>`<span class="tag">${icon(x,"small")}${esc(x)} <button data-remove="${esc(x)}" aria-label="移除 ${esc(x)}">×</button></span>`).join(""):'<span class="panel-note">尚未选择素材</span>'}</div><label class="section-label" for="search">全部可查询素材</label><div class="material-picker"><input id="search" value="${esc(state.dropSearch)}" placeholder="输入素材名称" autocomplete="off"><div class="options">${available.map(x=>`<button type="button" class="option" data-option="${esc(x)}" aria-pressed="${selected.includes(x)}"><span class="option-main">${icon(x)}<span>${esc(x)}</span></span><span>${selected.includes(x)?"已选":"选择"}</span></button>`).join("")||'<p class="empty">没有匹配的素材名称</p>'}</div></div></aside><section class="panel" aria-live="polite"><div class="result-head"><h2>符合条件的关卡</h2><span class="result-count">${results.length} 个</span></div><p class="panel-note">红色标签为你的目标素材。关卡数据未包含体力消耗、掉落数量或概率。</p><div class="stage-list">${results.length?results.map(s=>`<article class="stage-card"><div class="stage-card-top"><span class="stage-id">${s.id}</span><span class="matches">命中 ${selected.length||s.drops.length} 项目标</span></div><ul class="drop-list">${s.drops.map(x=>`<li class="${selected.includes(x)?"match":""}">${icon(x,"small")}${esc(x)}</li>`).join("")}</ul></article>`).join(""):'<p class="empty">没有关卡能够同时掉落目前选择的素材。请减少筛选条件后重试。</p>'}</div></section></section>`;
      const search=document.querySelector("#search");
      search.oninput=e=>{const position=e.target.selectionStart;state.dropSearch=e.target.value.trim();drops(new URLSearchParams());const next=document.querySelector("#search");next.focus();next.setSelectionRange(position,position)};
      document.querySelectorAll("[data-option]").forEach(button=>button.onclick=()=>{const x=button.dataset.option;state.selectedDrops=selected.includes(x)?selected.filter(y=>y!==x):[...selected,x];drops(new URLSearchParams())});
      document.querySelectorAll("[data-remove]").forEach(button=>button.onclick=()=>{state.selectedDrops=selected.filter(x=>x!==button.dataset.remove);drops(new URLSearchParams())});
      document.querySelector("#clear").onclick=()=>{state.selectedDrops=[];state.dropSearch="";drops(new URLSearchParams())};
    }
    const options=(items,current)=>`<option value="">不选择</option>${items.map(x=>`<option value="${esc(x)}" ${x===current?"selected":""}>${esc(x)}</option>`).join("")}`;
    const selectOptions=(items,current,valueKey,labelKey,placeholder)=>`<option value="">${placeholder}</option>${items.map(item=>`<option value="${esc(item[valueKey])}" ${String(item[valueKey])===String(current)?"selected":""}>${esc(item[labelKey])}</option>`).join("")}`;
    const manualItems=i=>state.manualStage==="1"?dropMaterials:state.manualStage==="2"?(i===0?lv1Materials:dropMaterials):(i===0?paintMaterials:i===5?insightMaterials:regularMaterials);
    const manualLabel=i=>state.manualStage==="1"?`掉落素材 ${i+1}`:state.manualStage==="2"?(i===0?"贈物Lv1":`掉落素材 ${i}`):(i===0?"絵具":i===5?"心得":`贈物 ${i}`);
    const manualNote=()=>state.manualStage==="1"?"共2格，全部选择掉落素材。":state.manualStage==="2"?"第1格为贈物Lv1，第2～4格为掉落素材。":state.manualStage==="3"?"第1格为絵具，第2～5格为贈物，第6格为心得。":"请先选择解放阶段，随后会显示对应的材料输入格。";
    function calculator(){
      const active=autoActive(),sword=selectedSword(),stage=selectedStage();
      const availableTypes=swordTypes.filter(type=>swords.some(item=>String(item.rarity)===String(state.rarity)&&String(item.typeId)===String(type.id)));
      if(state.swordType&&!availableTypes.some(type=>String(type.id)===String(state.swordType))){state.swordType="";state.swordId="";state.stage=""}
      const availableSwords=swords.filter(item=>String(item.rarity)===String(state.rarity)&&String(item.typeId)===String(state.swordType)).sort((a,b)=>a.baseId-b.baseId||a.id.localeCompare(b.id));
      if(state.swordId&&!availableSwords.some(item=>item.id===state.swordId)){state.swordId="";state.stage=""}
      const data=requirementData();
      const rows=data.rows.map(item=>{const owned=Math.max(0,Number(state.owned[item.name])||0);return {...item,owned,lacking:Math.max(0,item.required-owned)}});
      const shown=state.hideZero?rows.filter(item=>item.required||item.owned):rows;
      const stageSummary=active?`<div class="auto-summary"><p class="auto-summary-title">${esc(sword.displayName)} · 第${stage.stage}阶段（解放后等级上限 ${stage.cap}）</p><div class="source-materials">${stage.materials.map(([name,amount])=>`<span class="source-material">${icon(name,"small")}${esc(name)} ×${amount}</span>`).join("")}</div><p class="stage-data-note">按所选阶段单独计算。絵具仅消耗小判制作，不计入最终掉落素材。</p></div>`:"";
      main.innerHTML=`<section class="page-head"><div><p class="eyebrow">上限解放素材计算器</p><h1>筛选刀剑或手动计算</h1><p>优先按稀有度、刀种、刀剑和突破阶段快速计算；不选择刀剑时可按解放阶段手动输入材料。</p></div></section><section class="calculator-grid"><section class="panel"><div class="sword-filter"><div class="sword-filter-head"><h3>按刀剑快速计算</h3><button type="button" class="button ghost" id="clear-sword">清除刀剑筛选</button></div><div class="sword-filter-grid"><div class="filter-field"><label for="rarity">1. 稀有度</label><select id="rarity">${selectOptions([{id:"素",name:"素"},{id:"彩",name:"彩"}],state.rarity,"id","name","请选择稀有度")}</select></div><div class="filter-field"><label for="sword-type">2. 刀种</label><select id="sword-type" ${state.rarity?"":"disabled"}>${selectOptions(availableTypes,state.swordType,"id","name",state.rarity?"请选择刀种":"请先选择稀有度")}</select></div><div class="filter-field"><label for="sword">3. 刀剑</label><select id="sword" ${state.swordType?"":"disabled"}>${selectOptions(availableSwords,state.swordId,"id","displayName",state.swordType?"请选择刀剑":"请先选择刀种")}</select></div><div class="filter-field"><label for="break-stage">4. 突破阶段</label><select id="break-stage" ${sword?"":"disabled"}><option value="">${sword?"请选择突破阶段":"请先选择刀剑"}</option>${sword?sword.stages.map(item=>`<option value="${item.stage}" ${String(item.stage)===String(state.stage)?"selected":""}>第${item.stage}阶段（上限 ${item.cap}）</option>`).join(""):""}</select></div></div>${stageSummary}</div><div class="mode-divider">或手动输入</div><div class="manual-block ${active?"is-disabled":""}"><h2>输入所需突破材料</h2><div class="filter-field"><label for="manual-stage">先选择解放阶段</label><select id="manual-stage" ${active?"disabled":""}><option value="">请选择解放阶段</option><option value="1" ${state.manualStage==="1"?"selected":""}>解放阶段1</option><option value="2" ${state.manualStage==="2"?"selected":""}>解放阶段2</option><option value="3" ${state.manualStage==="3"?"selected":""}>解放阶段3</option></select></div><p class="panel-note">${manualNote()} 数量默认为1。</p><div>${state.selections.map((item,i)=>`<div class="selection-row"><label for="material-${i}">${i+1}</label>${item.name?icon(item.name,"large"):'<span class="item-icon-placeholder"></span>'}<select id="material-${i}" data-name="${i}" aria-label="${manualLabel(i)}" ${active?"disabled":""}>${options(manualItems(i),item.name)}</select><input type="number" min="0" step="1" value="${item.quantity}" data-quantity="${i}" aria-label="${manualLabel(i)}所需数量" ${active?"disabled":""}></div>`).join("")}</div></div><div class="calc-actions"><button type="button" class="button secondary" id="reset">重置全部</button><button type="button" class="button" id="send">查询这些素材的掉落关卡</button></div><label class="toggle"><input id="hide" type="checkbox" ${state.hideZero?"checked":""}>默认隐藏数量为0的素材</label></section><section class="panel" aria-live="polite"><div class="result-head"><h2>最终所需掉落素材</h2><span class="result-count">${shown.filter(item=>item.lacking).length} 种缺少</span></div><p class="panel-note">“已有”由你自行填写，缺少数量不会低于0。</p>${data.unknown.length?`<p class="data-warning">以下材料尚无可用配方或关卡数据：${data.unknown.map(esc).join("、")}</p>`:""}<div class="table-wrap"><table class="material-table"><thead><tr><th>素材</th><th>所需</th><th>已有</th><th>缺少</th></tr></thead><tbody>${shown.length?shown.map(item=>`<tr><td><span class="material-name">${icon(item.name)}<span>${esc(item.name)}</span></span></td><td>${item.required}</td><td><input type="number" min="0" step="1" value="${item.owned||""}" placeholder="0" data-owned="${esc(item.name)}" aria-label="${esc(item.name)} 已有数量"></td><td class="${item.lacking?"need":"zero"}">${item.lacking}</td></tr>`).join(""):'<tr><td colspan="4" class="empty">请选择刀剑与突破阶段，或先选择手动解放阶段并输入材料。</td></tr>'}</tbody></table></div></section></section>`;
      document.querySelector("#rarity").onchange=event=>{state.rarity=event.target.value;state.swordType="";state.swordId="";state.stage="";calculator()};
      document.querySelector("#sword-type").onchange=event=>{state.swordType=event.target.value;state.swordId="";state.stage="";calculator()};
      document.querySelector("#sword").onchange=event=>{state.swordId=event.target.value;state.stage="";calculator()};
      document.querySelector("#break-stage").onchange=event=>{state.stage=event.target.value;calculator()};
      document.querySelector("#clear-sword").onclick=()=>{state.rarity="";state.swordType="";state.swordId="";state.stage="";calculator()};
      document.querySelector("#manual-stage").onchange=event=>{state.manualStage=event.target.value;state.selections=emptySelections(state.manualStage);calculator()};
      document.querySelectorAll("[data-name]").forEach(element=>element.onchange=()=>{state.selections[+element.dataset.name].name=element.value;calculator()});
      document.querySelectorAll("[data-quantity]").forEach(element=>element.onchange=()=>{state.selections[+element.dataset.quantity].quantity=Math.max(0,Number(element.value)||0);calculator()});
      document.querySelectorAll("[data-owned]").forEach(element=>element.onchange=()=>{state.owned[element.dataset.owned]=Math.max(0,Number(element.value)||0);calculator()});
      document.querySelector("#hide").onchange=e=>{state.hideZero=e.target.checked;calculator()};
      document.querySelector("#reset").onclick=()=>{state.rarity="";state.swordType="";state.swordId="";state.stage="";state.manualStage="";state.selections=[];state.owned={};state.hideZero=true;calculator()};
      document.querySelector("#send").onclick=()=>{const materials=rows.filter(item=>item.lacking).map(item=>item.name);state.selectedDrops=materials;go("drops",materials.length?new URLSearchParams({materials:materials.join(",")}):null)};
    }
    function about(){main.innerHTML=`<section class="about"><p class="eyebrow">使用说明</p><h1>资料范围与使用方式</h1><div class="notice">本网站为非官方玩家工具，与游戏官方及相关权利方无关。</div><p class="creator-contact">作者：里崎夕子<br>报错请联系小红书账号：@里崎夕子（ID：1165014862）</p><div class="panel"><h2>素材关卡查询</h2><ul><li>可同时选择多种素材，结果只保留同时掉落全部目标素材的关卡。</li><li>不选素材时显示全部已收录关卡。</li><li>数据目前含关卡名与掉落种类，不包含掉落数量或概率。</li></ul></div><div class="panel"><h2>上限解放计算器</h2><ul><li>刀剑快速计算：依次选择稀有度、刀种、刀剑和突破阶段，网站会读取该刀剑在所选阶段的材料并计算最终掉落素材。</li><li>手动计算需先选择解放阶段。阶段1提供2个掉落素材输入格；阶段2提供1个贈物Lv1和3个掉落素材输入格；阶段3提供1个絵具、4个贈物和1个心得输入格。</li><li>贈物会继续按配方展开，合并为最终需要的直接掉落素材。</li><li>填写“已有”后，缺少数量按“所需 − 已有”计算，最低为0；可将缺少素材直接带入关卡查询。</li></ul></div><div class="panel"><h2>作者声明</h2><p>本工具数据来源为游戏数据解包，请介意者自行退出。</p></div></section>`}
    function render(){const current=route();if(current.name==="drops")drops(current.params);else if(current.name==="calculator")calculator();else if(current.name==="about")about();else home()}
    window.addEventListener("hashchange",render);render();
  </script>
</body>
</html>
